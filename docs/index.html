<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fabric Alchemie</title>
<style>
  :root{
    --bg:#0b1220; --panel:#111a2e; --panel2:#16223a; --line:#26365a;
    --text:#e8eefc; --muted:#8fa3c8; --accent:#2dd4bf; --accent2:#60a5fa; --warn:#f59e0b;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:"Segoe UI",system-ui,sans-serif; color:var(--text);
    background:radial-gradient(1200px 700px at 20% 0%,#15305a 0%,var(--bg) 60%);
    display:flex; flex-direction:column; overflow:hidden; user-select:none; -webkit-user-select:none;
  }
  header{
    display:flex; align-items:center; gap:14px; padding:10px 16px;
    border-bottom:1px solid var(--line); background:rgba(11,18,32,.7); backdrop-filter:blur(6px);
    flex-wrap:wrap;
  }
  h1{font-size:1.15rem;margin:0;letter-spacing:.3px}
  h1 .accent{color:var(--accent)}
  .progress{flex:1;min-width:160px;max-width:340px}
  .bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}
  .count{font-size:.78rem;color:var(--muted);margin-top:3px}
  .btns{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
  button{
    background:var(--panel2);color:var(--text);border:1px solid var(--line);
    padding:7px 12px;border-radius:8px;font:inherit;font-size:.85rem;cursor:pointer;
  }
  button:hover{border-color:var(--accent)}
  main{flex:1;display:flex;min-height:0}
  #ws{
    flex:1;position:relative;min-width:0;
    background-image:radial-gradient(circle,#1e2d4d 1px,transparent 1px);background-size:26px 26px;
  }
  #empty{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
    color:var(--muted);pointer-events:none;padding:24px;font-size:1.05rem;line-height:1.6;
  }
  aside{
    width:300px;display:flex;flex-direction:column;background:var(--panel);
    border-left:1px solid var(--line);min-height:0;transition:background .15s, border-color .15s;
  }
  aside.trash{background:#3a1620;border-color:#ef4444}
  aside .top{padding:10px;border-bottom:1px solid var(--line);display:flex;gap:8px}
  aside input{
    flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:7px 10px;font:inherit;font-size:.85rem;user-select:text;-webkit-user-select:text;
  }
  #list{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 10px 10px}
  #list .chip{white-space:normal;max-width:100%}
  .folder{margin-top:6px}
  .folder-h{
    display:flex;align-items:center;gap:7px;padding:7px 4px;cursor:pointer;
    font-size:.8rem;font-weight:600;letter-spacing:.2px;color:var(--muted);
    border-bottom:1px solid var(--line);
  }
  .folder-h:hover{color:var(--text)}
  .folder-h .arrow{display:inline-block;font-size:.7rem;transition:transform .15s}
  .folder.open .folder-h .arrow{transform:rotate(90deg)}
  .folder-h .fname{flex:1}
  .folder-h .fcount{font-weight:400;font-size:.72rem}
  .folder-h .fresh-dot{width:7px;height:7px;border-radius:50%;background:var(--warn)}
  .folder-b{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0 4px}
  i.final{display:inline-block;flex:none;width:8px;height:8px;border-radius:50%;background:#ef4444;margin-left:1px}
  #tip .fin{margin-top:6px;color:#fca5a5;font-size:.8rem}
  #legend{padding:8px 12px;border-top:1px solid var(--line);font-size:.72rem;color:var(--muted);text-align:center}
  .chip,.item{
    display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:10px;
    background:var(--panel2);border:1px solid var(--line);font-size:.88rem;white-space:nowrap;
    touch-action:none;cursor:grab;
  }
  .chip:hover{border-color:var(--accent)}
  .chip.base{border-color:#3b82f6;background:#152a4d}
  .chip.fresh::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--warn);margin-left:2px}
  .chip .e,.item .e{font-size:1.15rem;line-height:1}
  .item{position:absolute;transform:translate(-50%,-50%);z-index:2;box-shadow:0 4px 14px rgba(0,0,0,.35);
    animation:pop .25s ease-out}
  .item.base{border-color:#3b82f6;background:#152a4d}
  .item.drag{cursor:grabbing;z-index:50;box-shadow:0 10px 26px rgba(0,0,0,.5);border-color:var(--accent)}
  .item.target{border-color:var(--warn);box-shadow:0 0 0 3px rgba(245,158,11,.35)}
  .item.shake{animation:shake .35s}
  .item.glow{animation:glow 1s ease-out}
  .item.hint,.chip.hint{border-color:var(--warn);box-shadow:0 0 0 3px rgba(245,158,11,.45)}
  @keyframes pop{from{transform:translate(-50%,-50%) scale(.6);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
  @keyframes shake{0%,100%{margin-left:0}25%{margin-left:-7px}75%{margin-left:7px}}
  @keyframes glow{0%{box-shadow:0 0 0 0 rgba(45,212,191,.9)}100%{box-shadow:0 0 0 26px rgba(45,212,191,0)}}
  #tip{
    position:fixed;z-index:150;max-width:290px;display:none;background:#0d1730;border:1px solid var(--accent);
    border-radius:12px;padding:11px 14px;font-size:.85rem;line-height:1.45;box-shadow:0 10px 30px rgba(0,0,0,.55);
  }
  #tip .h{font-weight:600;margin-bottom:3px}
  #tip .d{color:var(--muted)}
  #tip a{display:block;margin-top:7px;color:var(--accent2);text-decoration:none}
  #tip a:hover{text-decoration:underline}
  #toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);
    background:#0f2a2a;border:1px solid var(--accent);color:var(--text);
    padding:11px 16px;border-radius:12px;max-width:min(520px,92vw);opacity:0;pointer-events:none;
    transition:.3s;z-index:100;text-align:center;font-size:.9rem;line-height:1.4;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast b{color:var(--accent)}
  #toast.info{background:#2a2410;border-color:var(--warn)}
  #toast.info b{color:var(--warn)}
  #win{
    position:fixed;inset:0;background:rgba(5,10,20,.8);display:none;align-items:center;justify-content:center;z-index:200;padding:20px;
  }
  #win.show{display:flex}
  #win div{background:var(--panel);border:1px solid var(--accent);border-radius:16px;padding:26px;max-width:460px;text-align:center;line-height:1.55}
  #win h2{margin:0 0 8px;color:var(--accent)}
  @media (max-width:720px){
    main{flex-direction:column}
    aside{width:100%;height:42%;border-left:0;border-top:1px solid var(--line)}
    .btns{margin-left:0}
  }

select{
  background:var(--panel2);color:var(--text);border:1px solid var(--line);
  padding:7px 10px;border-radius:8px;font:inherit;font-size:.85rem;cursor:pointer;
}
select:hover{border-color:var(--accent)}

</style>
</head>
<body>
<header>
  <h1><span data-i18n="titleA"></span> <span class="accent" data-i18n="titleB"></span></h1>
  <div class="progress">
    <div class="bar"><i id="bar"></i></div>
    <div class="count" id="count"></div>
  </div>
  <div class="btns">
    <select id="langSel" aria-label="Language"></select>
    <button id="hintBtn" data-i18n="hint" data-i18n-title="hintTitle"></button>
    <button id="clearBtn" data-i18n="clear"></button>
    <button id="resetBtn" data-i18n="reset"></button>
  </div>
</header>
<main>
  <div id="ws"><div id="empty" data-i18n-html="empty"></div></div>
  <aside id="side">
    <div class="top"><input id="search" type="search" data-i18n-placeholder="search" autocomplete="off"></div>
    <div id="list"></div>
    <div id="legend" data-i18n-html="legend"></div>
  </aside>
</main>
<div id="tip"></div>
<div id="toast"></div>
<div id="win"><div>
  <h2 data-i18n="winTitle"></h2>
  <p id="winText"></p>
  <button id="winClose" data-i18n="winClose"></button>
</div></div>

// Spiel-Logik. Sprachneutral: alle Texte kommen aus I18N (src/i18n/<sprache>.js),
// alle Elemente aus EMOJI (src/data/elements.js), Rezepte aus RECIPES, Links aus LINKS.
(function(){
  const KEY = "fabric-alchemie-v2";
  const $ = s => document.querySelector(s);
  const ws = $("#ws"), list = $("#list"), side = $("#side");

  // --- Sprache ---
  // I18N_ALL enthält alle Sprachen (vom Build erzeugt). Gewählt wird: ?lang=… in der Adresse,
  // sonst die zuletzt gewählte Sprache, sonst die Browsersprache, sonst Deutsch.
  const LANG_KEY = "fabric-alchemie-lang";
  const langCodes = Object.keys(I18N_ALL);
  const langSel = $("#langSel");
  let I18N, ELEMENTS = {};   // aktuelle Sprache; ELEMENTS: ID → [Name, Symbol, Beschreibung]

  const T = (key, vars) => (I18N.ui[key] ?? key).replace(/\{(\w+)\}/g, (m, k) => vars && k in vars ? vars[k] : m);

  function pickLang(){
    let c = null;
    try{ c = new URLSearchParams(location.search).get("lang"); }catch(e){}
    if(!langCodes.includes(c)){ try{ c = localStorage.getItem(LANG_KEY); }catch(e){} }
    if(!langCodes.includes(c)) c = (navigator.language || "").slice(0, 2).toLowerCase();
    return langCodes.includes(c) ? c : (langCodes.includes("de") ? "de" : langCodes[0]);
  }

  function setLang(code, persist){
    I18N = I18N_ALL[code];
    ELEMENTS = {};
    Object.keys(EMOJI).forEach(id => { const [name, desc] = I18N.elements[id]; ELEMENTS[id] = [name, EMOJI[id], desc]; });
    document.documentElement.lang = I18N.lang;
    document.title = I18N.ui.title;
    document.querySelectorAll("[data-i18n]").forEach(n => n.textContent = T(n.dataset.i18n));
    document.querySelectorAll("[data-i18n-html]").forEach(n => n.innerHTML = T(n.dataset.i18nHtml));
    document.querySelectorAll("[data-i18n-title]").forEach(n => n.title = T(n.dataset.i18nTitle));
    document.querySelectorAll("[data-i18n-placeholder]").forEach(n => n.placeholder = T(n.dataset.i18nPlaceholder));
    langSel.value = code;
    if(persist){ try{ localStorage.setItem(LANG_KEY, code); }catch(e){} }
  }

  langCodes.forEach(c => { const o = document.createElement("option"); o.value = c; o.textContent = I18N_ALL[c].name || c; langSel.appendChild(o); });
  langSel.addEventListener("change", () => {
    setLang(langSel.value, true);
    hideTip(); $("#toast").classList.remove("show");
    renderList();
    ws.querySelectorAll(".item").forEach(n => { n.innerHTML = chipHTML(n.dataset.id); });
  });

  // Ein Zutatenpaar kann mehrere Ergebnisse haben; ein optionales 4. Feld nennt Zutaten, die erhalten bleiben.
  const recipeMap = new Map();
  RECIPES.forEach(([a,b,c,keep]) => {
    const k = [a,b].sort().join("|");
    const r = recipeMap.get(k) || {res:[], keep:new Set()};
    if(!r.res.includes(c)) r.res.push(c);
    (keep || []).forEach(x => r.keep.add(x));
    recipeMap.set(k, r);
  });
  const total = Object.keys(EMOJI).length;

  // --- Ordner und finale Elemente ---
  // Final = kommt in keinem Rezept als Zutat vor, lässt sich also nicht weiter kombinieren (roter Punkt).
  const FOLDER_KEY = "fabric-alchemie-folders";
  const folderOf = {};
  CATEGORIES.forEach(([f, els]) => els.forEach(id => { folderOf[id] = f; }));
  const usedAsIngredient = new Set(RECIPES.flatMap(r => [r[0], r[1]]));
  const isFinal = id => !usedAsIngredient.has(id);
  let closed = new Set();   // eingeklappte Ordner
  try{ closed = new Set(JSON.parse(localStorage.getItem(FOLDER_KEY)) || []); }catch(e){}
  const saveFolders = () => { try{ localStorage.setItem(FOLDER_KEY, JSON.stringify([...closed])); }catch(e){} };
  const openFolderOf = id => { if(closed.delete(folderOf[id])) saveFolders(); };

  let found = [...BASE];
  let fresh = new Set();
  let won = false;

  function load(){
    try{
      const s = JSON.parse(localStorage.getItem(KEY));
      if(s && Array.isArray(s.found)){
        found = [...new Set([...BASE, ...s.found.filter(id => ELEMENTS[id])])];
        won = !!s.won;
      }
    }catch(e){}
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify({found, won})); }catch(e){}
  }

  /* ---------- Sidebar ---------- */
  function chipHTML(id){
    const [n,e] = ELEMENTS[id];
    return `<span class="e">${e}</span><span>${n}</span>${isFinal(id) ? '<i class="final"></i>' : ""}`;
  }

  function renderList(){
    const q = $("#search").value.trim().toLowerCase();
    const scroll = list.scrollTop;
    list.innerHTML = "";
    CATEGORIES.forEach(([fid, members]) => {
      const mine = found.filter(id => folderOf[id] === fid);
      const shown = q ? mine.filter(id => ELEMENTS[id][0].toLowerCase().includes(q)) : mine;
      if(!shown.length) return;
      const open = !!q || !closed.has(fid);   // bei einer Suche sind alle Treffer-Ordner offen
      const box = document.createElement("div");
      box.className = "folder" + (open ? " open" : "");
      const head = document.createElement("div");
      head.className = "folder-h";
      head.innerHTML = `<span class="arrow">▸</span><span class="fname">${esc(I18N.folders[fid])}</span>` +
        `<span class="fcount">${mine.length}/${members.length}</span>` +
        (mine.some(id => fresh.has(id)) ? '<i class="fresh-dot"></i>' : "");
      head.addEventListener("click", () => {
        if(q) return;
        if(closed.has(fid)) closed.delete(fid); else closed.add(fid);
        saveFolders(); renderList();
      });
      box.appendChild(head);
      if(open){
        const body = document.createElement("div");
        body.className = "folder-b";
        shown.forEach(id => {
          const c = document.createElement("div");
          c.className = "chip" + (BASE.includes(id) ? " base" : "") + (fresh.has(id) ? " fresh" : "");
          c.dataset.id = id; c.innerHTML = chipHTML(id);
          c.addEventListener("pointerdown", ev => startDrag(ev, id, null));
          body.appendChild(c);
        });
        box.appendChild(body);
      }
      list.appendChild(box);
    });
    list.scrollTop = scroll;
    $("#bar").style.width = (found.length/total*100) + "%";
    $("#count").textContent = T("count", {n: found.length, total});
  }

  /* ---------- Arbeitsfläche ---------- */
  function updateEmpty(){ $("#empty").style.display = ws.querySelectorAll(".item").length ? "none" : "flex"; }

  function makeItem(id, x, y){
    const it = document.createElement("div");
    it.className = "item" + (BASE.includes(id) ? " base" : "");
    it.dataset.id = id; it.innerHTML = chipHTML(id); attachTip(it, id);
    it.style.left = x + "px"; it.style.top = y + "px";
    it.addEventListener("pointerdown", ev => startDrag(ev, id, it));
    it.addEventListener("dblclick", () => {
      const r = it.getBoundingClientRect(), w = ws.getBoundingClientRect();
      makeItem(id, r.left - w.left + r.width/2 + 24, r.top - w.top + r.height/2 + 24);
    });
    ws.appendChild(it);
    updateEmpty();
    return it;
  }

  /* ---------- Drag & Drop ---------- */
  let drag = null;

  function startDrag(ev, id, existing){
    if(ev.button !== undefined && ev.button !== 0) return;
    ev.preventDefault();
    const w = ws.getBoundingClientRect();
    let el = existing;
    if(!el) el = makeItem(id, ev.clientX - w.left, ev.clientY - w.top);
    el.classList.add("drag");
    el.style.zIndex = 50;
    const r = el.getBoundingClientRect();
    hideTip();
    drag = {
      id, el, target: null, sx: ev.clientX, sy: ev.clientY, moved: false, touch: ev.pointerType !== "mouse",
      dx: existing ? (r.left + r.width/2) - ev.clientX : 0,
      dy: existing ? (r.top + r.height/2) - ev.clientY : 0
    };
    moveDrag(ev);
  }

  function centerOf(el){ const r = el.getBoundingClientRect(); return {x:r.left+r.width/2, y:r.top+r.height/2, r}; }

  function findTarget(el){
    const a = centerOf(el);
    let best = null, bd = 1e9;
    ws.querySelectorAll(".item").forEach(o => {
      if(o === el) return;
      const b = centerOf(o);
      const overlap = a.r.left < b.r.right && a.r.right > b.r.left && a.r.top < b.r.bottom && a.r.bottom > b.r.top;
      const d = Math.hypot(a.x-b.x, a.y-b.y);
      if(overlap && d < bd){ bd = d; best = o; }
    });
    return best;
  }

  function overSide(ev){
    const r = side.getBoundingClientRect();
    return ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom;
  }

  function moveDrag(ev){
    if(!drag) return;
    if(Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy) > 6) drag.moved = true;
    const w = ws.getBoundingClientRect();
    drag.el.style.left = (ev.clientX + drag.dx - w.left) + "px";
    drag.el.style.top  = (ev.clientY + drag.dy - w.top) + "px";
    const t = findTarget(drag.el);
    if(t !== drag.target){
      if(drag.target) drag.target.classList.remove("target");
      if(t) t.classList.add("target");
      drag.target = t;
    }
    side.classList.toggle("trash", overSide(ev));
  }

  function endDrag(ev){
    if(!drag) return;
    const {el, target, id, moved, touch} = drag;
    drag = null;
    side.classList.remove("trash");
    el.classList.remove("drag"); el.style.zIndex = "";
    if(target) target.classList.remove("target");

    if(overSide(ev)){ el.remove(); updateEmpty(); return; }
    if(touch && !moved && !target) setTimeout(() => { if(el.isConnected) showTip(el, id); }, 0);

    // in die Fläche zurückholen
    const w = ws.getBoundingClientRect();
    let x = parseFloat(el.style.left), y = parseFloat(el.style.top);
    x = Math.max(40, Math.min(w.width-40, x));
    y = Math.max(24, Math.min(w.height-24, y));
    el.style.left = x + "px"; el.style.top = y + "px";

    if(target){
      const rec = recipeMap.get([id, target.dataset.id].sort().join("|"));
      if(rec){
        const a = centerOf(el), b = centerOf(target), ww = ws.getBoundingClientRect();
        const mx = (a.x+b.x)/2 - ww.left, my = (a.y+b.y)/2 - ww.top;
        // Zutaten entfernen – außer denen, die erhalten bleiben (dann zur Seite rücken)
        [[el, id, a.x - b.x], [target, target.dataset.id, b.x - a.x]].forEach(([node, nid, dx]) => {
          if(rec.keep.has(nid)){ node.style.left = (parseFloat(node.style.left) + (dx >= 0 ? 1 : -1) * 120) + "px"; }
          else node.remove();
        });
        const n = rec.res.length, nodes = [];
        rec.res.forEach((rid, i) => nodes.push(makeItem(rid, mx + (i - (n-1)/2) * 120, my + (rec.keep.size ? 60 : 0))));
        discoverAll(rec.res, nodes);
      } else {
        // keine Reaktion: leicht auseinanderschieben
        [el, target].forEach(n => { n.classList.remove("shake"); void n.offsetWidth; n.classList.add("shake"); });
        const dx = parseFloat(el.style.left) - parseFloat(target.style.left) || 1;
        el.style.left = (parseFloat(el.style.left) + Math.sign(dx)*70) + "px";
        toast("info", T("noReaction", {a: ELEMENTS[id][0], b: ELEMENTS[target.dataset.id][0]}));
      }
    }
  }

  document.addEventListener("pointermove", moveDrag);
  document.addEventListener("pointerup", endDrag);
  document.addEventListener("pointercancel", endDrag);

  /* ---------- Entdeckungen ---------- */
  function discoverAll(ids, nodes){
    const fresh_ = [];
    ids.forEach((id, i) => {
      if(nodes[i]) nodes[i].classList.add("glow");
      if(!found.includes(id)){ found.push(id); fresh.add(id); fresh_.push(id); }
    });
    if(!fresh_.length) return;
    fresh_.forEach(openFolderOf);   // Ordner mit neuen Elementen aufklappen
    save(); renderList();
    toast("", fresh_.map(id => { const [name, emoji, desc] = ELEMENTS[id]; return T("newFound", {emoji, name, desc}); }).join("<br><br>"));
    const chip = list.querySelector(`.chip[data-id="${fresh_[0]}"]`);
    if(chip) chip.scrollIntoView({block:"nearest"});
    if(fresh_.includes(GOAL) && !won){
      won = true; save();
      $("#winText").textContent = T("winText", {n: found.length, total}) + (found.length < total ? T("winMissing") : "");
      $("#win").classList.add("show");
    }
  }

  let toastTimer;
  function toast(cls, html){
    const t = $("#toast");
    t.className = cls || "";
    t.innerHTML = html;
    void t.offsetWidth;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
  }

  // "neu"-Markierung entfernen, sobald das Element benutzt wird
  list.addEventListener("pointerdown", ev => {
    const c = ev.target.closest(".chip");
    if(c && fresh.delete(c.dataset.id)) c.classList.remove("fresh");
  });

  /* ---------- Info-Karte mit Links ---------- */
  const tip = $("#tip"); let tipTimer;
  const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  function tipHTML(id){
    const [name, emoji, desc] = ELEMENTS[id];
    const [path, video] = LINKS[id] || [null, null];
    let s = `<div class="h">${emoji} ${esc(name)}</div><div class="d">${esc(desc)}</div>`;
    if(isFinal(id)) s += `<div class="fin">${esc(T("finalNote"))}</div>`;
    if(path && /^https?:\/\//.test(path)) s += `<a href="${path}" target="_blank" rel="noopener">${T("webLink")}</a>`;
    else if(path) s += `<a href="${I18N.learn}${path}" target="_blank" rel="noopener">${T("learnLink")}</a>`;
    if(video) s += `<a href="${video}" target="_blank" rel="noopener">${T("videoLink")}</a>`;
    return s;
  }
  function showTip(el, id){
    clearTimeout(tipTimer);
    tip.innerHTML = tipHTML(id);
    tip.style.display = "block";
    const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    let x = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width/2 - w/2));
    let y = r.top - h - 6; if(y < 8) y = r.bottom + 6;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }
  function hideTip(){ clearTimeout(tipTimer); tip.style.display = "none"; }
  function hideTipSoon(){ clearTimeout(tipTimer); tipTimer = setTimeout(hideTip, 250); }
  function attachTip(el, id){
    el.addEventListener("pointerenter", e => { if(e.pointerType === "mouse" && !drag) showTip(el, id); });
    el.addEventListener("pointerleave", e => { if(e.pointerType === "mouse") hideTipSoon(); });
  }
  tip.addEventListener("pointerenter", () => clearTimeout(tipTimer));
  tip.addEventListener("pointerleave", hideTipSoon);
  document.addEventListener("pointerdown", e => { if(!tip.contains(e.target)) hideTip(); }, true);

  /* ---------- Buttons ---------- */
  $("#search").addEventListener("input", renderList);
  $("#clearBtn").addEventListener("click", () => { ws.querySelectorAll(".item").forEach(n => n.remove()); updateEmpty(); });
  $("#resetBtn").addEventListener("click", () => {
    if(!confirm(T("resetConfirm"))) return;
    found = [...BASE]; fresh.clear(); won = false; save();
    ws.querySelectorAll(".item").forEach(n => n.remove()); updateEmpty(); renderList();
  });
  $("#winClose").addEventListener("click", () => $("#win").classList.remove("show"));
  $("#hintBtn").addEventListener("click", () => {
    const open = RECIPES.filter(([a,b,c]) => found.includes(a) && found.includes(b) && !found.includes(c));
    if(!open.length){
      toast("info", found.length >= total ? T("allFound") : T("noHint"));
      return;
    }
    const [a,b] = open[Math.floor(Math.random()*open.length)];
    toast("info", T("hintMsg", {a: ELEMENTS[a][0], b: ELEMENTS[b][0]}));
    [a,b].forEach(openFolderOf); renderList();   // Ordner der beiden Zutaten aufklappen
    [a,b].forEach(id => {
      const c = list.querySelector(`.chip[data-id="${id}"]`);
      if(c){ c.classList.add("hint"); setTimeout(() => c.classList.remove("hint"), 3000); }
    });
  });

  setLang(pickLang(), false);
  load(); renderList(); updateEmpty();
})();

</script>
</body>
</html>
